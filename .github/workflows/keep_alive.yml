name: Keep App Alive

on:
  schedule:
    - cron: "0 */6 * * *"  # cada 6 horas
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -s -o /dev/null -w "HTTP status: %{http_code}" --max-time 30 \
            https://ai-act-classifier-fkw8266qzl38rzgq4fwnqp.streamlit.app
